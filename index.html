<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertisseur d'Heures Perdir</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    h2 {
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .input-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .result {
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result span.value {
      color: var(--primary);
      font-size: 1.05rem;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    .footer {
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>⏱️ Conversion d'Heures</h2>

  <!-- Mode 1: Sexagésimal vers Décimal -->
  <div class="section">
    <div class="section-title">Heures & Minutes ➔ Décimal (ex: Chorus, Paie)</div>
    <div class="input-group">
      <input type="number" id="hh" placeholder="h" min="0" oninput="sexaToDec()">
      <span>h</span>
      <input type="number" id="mm" placeholder="min" min="0" max="59" oninput="sexaToDec()">
      <span>m</span>
    </div>
    <div class="result">
      Résultat : <span class="value" id="decResult">0.00 h</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Mode 2: Décimal vers Sexagésimal -->
  <div class="section">
    <div class="section-title">Décimal ➔ Heures & Minutes</div>
    <div class="input-group">
      <input type="number" id="decInput" placeholder="ex: 1.75" step="0.01" min="0" oninput="decToSexa()">
      <span>h</span>
    </div>
    <div class="result">
      Résultat : <span class="value" id="sexaResult">0h 00m</span>
    </div>
  </div>

  <div class="footer">Calcul instantané & local</div>
</div>

<script>
  function sexaToDec() {
    const h = parseFloat(document.getElementById('hh').value) || 0;
    const m = parseFloat(document.getElementById('mm').value) || 0;

    const totalDec = h + (m / 60);
    
    // Formatage avec 2 décimales (ex: 1.50)
    document.getElementById('decResult').innerText = totalDec.toFixed(2).replace('.', ',') + ' h';
  }

  function decToSexa() {
    const decVal = parseFloat(document.getElementById('decInput').value) || 0;
    
    const hours = Math.floor(decVal);
    const minutes = Math.round((decVal - hours) * 60);

    // Ajustement si l'arrondi donne 60 minutes
    if (minutes === 60) {
      document.getElementById('sexaResult').innerText = (hours + 1) + 'h 00m';
    } else {
      const paddedMinutes = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('sexaResult').innerText = hours + 'h ' + paddedMinutes + 'm';
    }
  }
</script>

</body>
</html>
